<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SensorBoard</title>
    <style>

body {
  display: grid;
  place-items: center;
}

/* javascript handled */

#app {
}

h1 {
  text-align: center;
}

/* navigation */
nav {
  display: flex;
  justify-content: center;
  background-color: #ddd;
}
nav > div {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.3em;
  text-align: center;
  background-color: #bbb;
  cursor: pointer;
}

nav > div.active {
  background-color: #bdb;
}

nav > div:hover {
  background-color: #999;
}

nav > div.active:hover {
  background-color: #9b9;
}

/* main content tab */

main {
}

.tabular {
  display: grid;
  grid: "name value";
}
.tabular > div {
  padding: 0.5ex 1em;
}
.tabular > div:nth-child(4n+3),
.tabular > div:nth-child(4n+4) {
  background-color: #eee;
}

/* action buttons */

.actions {
  display: flex;
  justify-content: center;
}
.actions > button {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.1em;
}

    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">

import { h, text, app } from "./hyperapp.js"


// Effects

const fetchJson = (dispatch, [url, action]) => {
  fetch(url)
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const timeout = (dispatch, [delay, action]) => {
  setTimeout(() => dispatch(action), delay);
};


// Events

const DISABLE_TIMEOUT = 750;

const GotServerStatus = (state, serverstatus) => [
  {...state, serverstatus: {...state.serverstatus, ...serverstatus},
            preference:{
                pumpDuration: state.serverstatus.pumpDuration,
                pumpInterval: state.serverstatus.pumpInterval,
            }
  },
  [timeout, [DISABLE_TIMEOUT, EnableInputs]],
];


// Actions

const EnableInputs = (state) => ({...state, disableInputs: false});
const DisableInputs = (state) => ({...state, disableInputs: true});

const ShowTabStatus = (state) => ({...state, activeTab: "status"});
const ShowTabPrefs = (state) => ({...state, activeTab: "prefs"});

const ActivatePump = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/activate", GotServerStatus]],
]);

const ResetPumpTime = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/reset", GotServerStatus]],
]);

const RebootServer = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/server/reboot", GotServerStatus]],
]);

/* TODO */
const PrefsSave = (state) => ({...state,  }
);

const PrefsRestore = (state,) => ({...state, preference:{
        pumpDuration: state.serverstatus.pumpDuration,
        pumpInterval: state.serverstatus.pumpInterval,
        }}
);


app({
  init: [
    {
      disableInputs: true,
      activeTab: "status",
      serverstatus: {
        serverTime: "",
        bootTime: "",
        localIP: "",
        prevPumpTime: "",
        nextPumpTime: "",
        pumpInterval: "",
        pumpDuration: "",
        numPumpEvents: "",
        sensorValue: "",
        temperature: "",
      },
        preference: {
        pumpDuration: "",
        pumpInterval: "",
      }
    },
    [fetchJson, ["api/status", GotServerStatus]],
  ],

  view: ({serverstatus, activeTab, disableInputs, preference}) => h("div", {}, [
    h("h1", {}, text("PlantWaterOS")),

    h("nav", {}, [
      h("div", {onclick: ShowTabStatus, class: {active: activeTab == "status"}}, text("Status")),
      h("div", {onclick: ShowTabPrefs, class: {active: activeTab == "prefs"}}, text("Preferences")),
    ]),

    activeTab == "status" &&
    h("main", {class: ["tabular", "statusinfo"]}, [
      h("div", {}, text("Server time:")),
      h("div", {}, text(serverstatus.serverTime)),
      h("div", {}, text("Server boot time:")),
      h("div", {}, text(serverstatus.bootTime)),
      h("div", {}, text("IP:")),
      h("div", {}, text(serverstatus.localIP)),

      h("div", {}, text("Last pump time:")),
      h("div", {}, text(serverstatus.prevPumpTime)),
      h("div", {}, text("Next pump time:")),
      h("div", {}, text(serverstatus.nextPumpTime)),

      h("div", {}, text("Total pump events:")),
      h("div", {}, text(serverstatus.numPumpEvents)),

      h("div", {}, text("Soil moisture:")),
      h("div", {}, text(serverstatus.sensorValue)),
      h("div", {}, text("Temperature:")),
      h("div", {}, text(parseFloat(serverstatus.temperature).toFixed(1) + "°C")),

      h("div", {}, text("System events:")),
      h("div", {}, [
        h("a", {href: "file/events.log", target: "_blank"}, text("events.log")),
      ]),

      h("div", {}, text("Logfile:")),
      h("div", {}, [
        h("a", {href: "file/sensor.log", target: "_blank"}, text("sensor.log")),
      ]),
    ]),
    activeTab == "status" &&
    h("div", {class: "actions"}, [
      h("button", {onclick: ActivatePump, disabled: disableInputs}, text("Pump now!")),
      h("button", {onclick: ResetPumpTime, disabled: disableInputs}, text("Reset pump timer!")),
      h("button", {onclick: RebootServer, disabled: disableInputs}, text("Reboot!")),
    ]),

    activeTab == "prefs" &&
    h("main", {class: ["tabular", "preferences"]}, [
      h("div", {}, text("Pump interval:")),
      h("div", {}, [
        h("input", {
          type: "number",
          value: preference.pumpInterval,
          min: "1",
          max: "99",
        }),
        h("span", {}, text(" days")),
      ]),

      h("div", {}, text("Pump duration:")),
      h("div", {}, [
        h("input", {
          type: "number",
          value: preference.pumpDuration,
          min: "100",
          max: "9999",
        }),
        h("span", {}, text(" ms")),
      ]),
    ]),
    activeTab == "prefs" &&
    h("div", {class: "actions"}, [
      h("button", {onclick: PrefsSave, disabled: disableInputs}, text("Save")),
      h("button", {onclick: PrefsRestore, disabled: disableInputs}, text("Restore")),
    ]),
  ]),

  node: document.getElementById("app"),
})

    </script>
  </body>
</html>
