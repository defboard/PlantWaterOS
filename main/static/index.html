<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SensorBoard</title>
    <style>

body {
  display: grid;
  place-items: center;
}

/* javascript handled */

#app {
}

h1 {
  text-align: center;
}

/* navigation */
nav {
  display: flex;
  justify-content: center;
  background-color: #ddd;
}
nav > div {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.3em;
  text-align: center;
  background-color: #bbb;
  cursor: pointer;
}

nav > div.active {
  background-color: #bdb;
}

nav > div:hover {
  background-color: #999;
}

nav > div.active:hover {
  background-color: #9b9;
}

/* main content tab */

main {
}

span.spacer {
  display: inline-block;
  width: 1em;
}

fieldset {
  padding: 0px 3px 3px 3px; /* t r b l */
  margin-top: 5px;
  margin-bottom: 10px;
  border: none;
  box-shadow: 0 0 10px #666;
  border-radius: 10px;
}
fieldset > legend {
  transform: translateY(-20%);
  background-color: white;
  font-size: 80%;
  font-weight: bold;
  width: auto;
  margin-left: auto;
  margin-right: auto;
}

dl {
  display: grid;
  grid: "name value";
  grid-template-columns: 1fr 1fr;
  margin: 0;
}
dl > * {
  padding: 0.5ex 1em;
  margin: 0;
}

dl > *:nth-child(4n+1),
dl > *:nth-child(4n+2) {
  background-color: #eee;
}
dl > *:nth-child(4n+3),
dl > *:nth-child(4n+4) {
  background-color: #fff;
}

dd input[type="button"] {
  width: 100%;
}

dt::after {
  content: " (*)";
  visibility: hidden;
  font-weight: bold;
}
dt.modified::after {
  visibility: visible;
}

/* action buttons */

.actions {
  display: flex;
  justify-content: center;
}
.actions > button {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.1em;
}

/* Plot */
.dataPoint {
  stroke: black;
  stroke-width: 0.2;
  fill: #00f;
}

.axis {
  stroke: black;
  stroke-width: 0.3;
}

.xtick, .ytick {
  stroke: black;
  stroke-width: 0.2;
}

.xticklabel {
  font-size: 3px;
  text-anchor: middle;
  dominant-baseline: hanging;
}

.yticklabel {
  font-size: 3px;
  text-anchor: end;
  dominant-baseline: middle;
}

.xgrid, .ygrid {
  stroke: gray;
  stroke-width: 0.1;
}

    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">

import { h, text, app } from "./hyperapp.js"


const updateRecursive = (a, b) => {
  for (const key in b) {
    if (typeof(a[key]) == "object" && !Array.isArray(a[key]) &&
        typeof(b[key]) == "object" && !Array.isArray(b[key]))
    {
      updateRecursive(a[key], b[key]);
    }
    else {
      a[key] = b[key];
    }
  }
  return a;
};


// Local storage

const storageKey = 'PlantWaterOS';
const savedState = JSON.parse(localStorage.getItem(storageKey) || "{}");
const initialState = {
  serverstatus: {
    serverTime: "",
    bootTime: "",
    localIP: "",
    prevPumpTime: "",
    nextPumpTime: "",
    pumpInterval: "",
    pumpDuration: "",
    numPumpEvents: "",
    sensorValue: "",
    temperature: "",
    sensorData: [],
    wifiMode: "STA",
    wifiSsid: "PlantWaterNet",
    wifiPassword: "",
  },
  // client
  activeTab: "status",
  editstatus: {},
};
updateRecursive(initialState, savedState);
updateRecursive(initialState, {
  disableInputs: true,
});

const storeLocal = (state) => {
  localStorage.setItem(storageKey, JSON.stringify({
    activeTab: state.activeTab,
    editstatus: state.editstatus,
  }));
  return state;
};

/*
 * Format local time in ISO 8601 format.
 *
 * Can not use d.getISOString() because it returns the time in UTC.
*/
const formatDateTime = (d) => {
  const pad = (num, places) => num.toString().padStart(places, '0');
  const year = pad(d.getFullYear(), 4);
  const month = pad(d.getMonth() + 1, 2);
  const day = pad(d.getDate(), 2);
  const hours = pad(d.getHours(), 2);
  const minutes = pad(d.getMinutes(), 2);
  const seconds = pad(d.getSeconds(), 2);
  const millis = pad(d.getMilliseconds(), 3);
  return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}.${millis}Z`;
};


// Effects

const fetchJson = (dispatch, [url, action]) => {
  fetch(url)
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const postRequest = (dispatch, [url, data, action]) => {
  fetch(url, {
    method: "POST",
    body: new URLSearchParams(data),
  })
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const timeout = (dispatch, [delay, action]) => {
  setTimeout(() => dispatch(action), delay);
};

const every = (dispatch, [delay, action]) => {
  const id = setInterval(() => { dispatch(action); }, delay);
  return () => clearInterval(id);
};


// Events

const DISABLE_TIMEOUT = 750;

const GotServerStatus = (state, serverstatus) => [
  storeLocal({
    ...state,
    clientTime: new Date(),
    serverstatus: {
      ...state.serverstatus,
      ...serverstatus,
    },
  }),
  [timeout, [DISABLE_TIMEOUT, EnableInputs]],
];


// Actions

const EnableInputs = (state) => storeLocal({...state, disableInputs: false});
const DisableInputs = (state) => storeLocal({...state, disableInputs: true});

const ShowTabStatus = (state) => storeLocal({...state, activeTab: "status"});
const ShowTabPrefs = (state) => storeLocal({...state, activeTab: "prefs"});

const ActivatePump = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/activate", GotServerStatus]],
]);

const ResetPumpTime = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/reset", GotServerStatus]],
]);

const RebootServer = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/server/reboot", GotServerStatus]],
]);

const UpdateStatus = (state) => ([
  state,
  [fetchJson, ["api/status", GotServerStatus]],
]);

const UpdateServerTime = (state, event) => {
  const data = {
    serverTime: formatDateTime(new Date()),   // ISO 8601
  };
  return [
    DisableInputs(state),
    [postRequest, ["api/server/time", data, GotServerStatus]],
  ];
};

/* TODO */
const isDefaultValue = (state, key, value) => (state.serverstatus[key] == value);
const hasDefaultValue = (state, key) => (
  state.editstatus[key] == undefined || isDefaultValue(state, key, state.editstatus[key])
);

const PrefsSave = (state, event) => ([
  DisableInputs({
    ...state,
    editstatus: {
      ...state.editstatus,
      wifiPassword: "",
    },
  }),
  [postRequest, ["prefs", state.editstatus, GotServerStatus]],
]);

const PrefsRestore = (state,) => storeLocal({...state, editstatus: {}});

const EditNumber = (key, multiplier) => (state, event) =>  storeLocal({
  ...state,
  editstatus: {
    ...state.editstatus,
    [key]: event.target.value * (multiplier ?? 1),
  },
});

const EditText = (key) => (state, event) => storeLocal({
  ...state,
  editstatus: {
    ...state.editstatus,
    [key]: event.target.value,
  },
});

const ToggleCheckBox = (key) => (state, event) =>  storeLocal({
  ...state,
  editstatus: {
    ...state.editstatus,
    [key]: state.editstatus[key] ? 0 : 1,
  },
});


// plotting

const delta = (limits) => limits[1] - limits[0];
const addMargin = (limits, margin) => [limits[0] - margin * delta(limits), limits[1] + margin * delta(limits)];

// Create a transform that maps values within the range [x1, x2] to the range [y1, y2]:
// x → (x - x1) / (x2 - x1) * (y2 - y1) + y1
const AffineTransform = ([x1, x2], [y1, y2]) => {
  const slope = (y2 - y1) / (x2 - x1);
  const offset = y1 - x1 * slope;
  return (x) => offset + slope * x;
};


const makeAxisTicks = ([x1, x2]) => {
  const dx = x2 - x1;
  const tickDeltaInit = Math.pow(10, Math.floor(Math.log10(dx)) - 1);
  const tickDeltaGuess = Array(20).keys().map(i => tickDeltaInit * (i + 1));
  const tickDelta = tickDeltaGuess.find(x => (x * 10 >= dx && x * 4 <= dx));
  let nextTick = Math.ceil(x1 / tickDelta) * tickDelta;
  let tickmarks = [];
  let ticklabels = [];
  while (nextTick < x2) {
    tickmarks.push(nextTick);
    ticklabels.push({loc: nextTick, label: nextTick});
    nextTick += tickDelta;
  }
  return { tickmarks, ticklabels };
};


const makeDateTicks = ([x1, x2]) => {
  const date1 = new Date(x1 * 1000);
  const date2 = new Date(x2 * 1000);

  const SECONDS_PER_DAY = 3600 * 24;

  const day1 = Date.UTC(date1.getFullYear(), date1.getMonth(), date1.getDate());
  const day2 = Date.UTC(date2.getFullYear(), date2.getMonth(), date2.getDate());

  const tickDelta = SECONDS_PER_DAY;
  let nextTick = day1.valueOf() / 1000;
  let lastTick = day2.valueOf() / 1000;
  let tickmarks = [];
  let ticklabels = [];
  while (nextTick <= lastTick) {
    if (nextTick >= x1 && nextTick <= x2) {
      const asDate = new Date(nextTick * 1000);
      tickmarks.push(nextTick);
      ticklabels.push({
        loc: nextTick + SECONDS_PER_DAY/2,
        label: `${asDate.getDate()}.${asDate.getMonth() + 1}.`,
      });
    }
    nextTick += tickDelta;
  }

  return { tickmarks, ticklabels };
};

const drawXAxis = (axisBounds, {tickmarks, ticklabels}, dataToFigure) => {
  const [x1, x2] = axisBounds.x;
  const [y1, y2] = axisBounds.y;
  return [
    h("line", { x1, y1, x2: x2, y2: y1, class: "axis" }, []),

    ...tickmarks.map(loc => {
      const x = dataToFigure(loc);
      return h("line", { x1: x, x2: x, y1: y1 - 1, y2: y1 + 1, class: "xtick" }, []);
    }),
    ...tickmarks.map(loc => {
      const x = dataToFigure(loc);
      return h("line", { x1: x, x2: x, y1, y2, class: "xgrid" }, [])
    }),

    ...ticklabels.map(({loc, label}) => {
      const x = dataToFigure(loc);
      return h("text", { x: x, y: y1 + 2, class: "xticklabel" }, text(label));
    }),
  ];
};

const drawYAxis = (axisBounds, {tickmarks, ticklabels}, dataToFigure) => {
  const [x1, x2] = axisBounds.x;
  const [y1, y2] = axisBounds.y;
  return [
    h("line", {  x1, y1, x2: x1, y2: y2, class: "axis" }, []),

    ...tickmarks.map(loc => {
      const y = dataToFigure(loc);
      return h("line", { y1: y, y2: y, x1: x1 - 1, x2: x1 + 1, class: "ytick" }, []);
    }),
    ...tickmarks.map(loc => {
      const y = dataToFigure(loc);
      return h("line", { y1: y, y2: y, x1, x2, class: "ygrid" }, []);
    }),

    ...ticklabels.map(({loc, label}) => {
      const y = dataToFigure(loc);
      return h("text", { x: x1 - 2, y: y, class: "yticklabel" }, text(label));
    }),
  ];
};


const ShowGraph = ({sensorData}) => {
    const axisBounds = {x: [10, 95], y: [90, 5]};

    const xdata = sensorData.map(elem => elem[0]);
    const ydata = sensorData.map(elem => elem[1]);
    const xdatalim = [Math.min(...xdata), Math.max(...xdata)];
    const ydatalim = [Math.min(...ydata), Math.max(...ydata)];
    const xlim = addMargin(xdatalim, 0.1);
    const ylim = addMargin(ydatalim, 0.1);
    const xticks = makeDateTicks(xlim);
    const yticks = makeAxisTicks(ylim);

    const dataToFigure = {
      x: AffineTransform(xlim, axisBounds.x),
      y: AffineTransform(ylim, axisBounds.y),
    };

    return h("svg", { viewBox: "0 0 100 100" }, [
        ...drawXAxis(axisBounds, xticks, dataToFigure.x),
        ...drawYAxis(axisBounds, yticks, dataToFigure.y),
        ...sensorData.map(([x, y]) => {
          return h("circle", {
            cx: dataToFigure.x(x),
            cy: dataToFigure.y(y),
            r: 0.5,
            class: "dataPoint",
          }, []);
        }),
    ]);
};


app({
  init: UpdateStatus(initialState),

  subscriptions: (state) => [
    [every, [1000, UpdateStatus]],
  ],

  view: ({serverstatus, activeTab, disableInputs, editstatus}) => h("div", {}, [
    h("h1", {}, text("PlantWaterOS")),

    h("nav", {}, [
      h("div", {onclick: ShowTabStatus, class: {active: activeTab == "status"}}, text("Status")),
      h("div", {onclick: ShowTabPrefs, class: {active: activeTab == "prefs"}}, text("Preferences")),
    ]),

    activeTab == "status" && h('main', {}, [
      h("dl", {}, [
        h("dt", {}, text("Server time:")),
        h("dd", {}, text(serverstatus.serverTime)),
        h("dt", {}, text("Server boot time:")),
        h("dd", {}, text(serverstatus.bootTime)),
        h("dt", {}, text("IP:")),
        h("dd", {}, text(serverstatus.localIP)),

        h("dt", {}, text("Last pump time:")),
        h("dd", {}, text(serverstatus.prevPumpTime)),
        h("dt", {}, text("Next pump time:")),
        h("dd", {}, text(serverstatus.nextPumpTime)),

        h("dt", {}, text("Total pump events:")),
        h("dd", {}, text(serverstatus.numPumpEvents)),

        h("dt", {}, text("Soil moisture:")),
        h("dd", {}, text(serverstatus.sensorValue)),
        h("dt", {}, text("Temperature:")),
        h("dd", {}, text(parseFloat(serverstatus.temperature).toFixed(1) + "°C")),

        h("dt", {}, text("System events:")),
        h("dd", {}, [
          h("a", {href: "file/events.log", target: "_blank"}, text("events.log")),
        ]),

        h("dt", {}, text("Logfile:")),
        h("dd", {}, [
          h("a", {href: "file/sensor.log", target: "_blank"}, text("sensor.log")),
        ]),

        h("dt", {}, text("Update firmware:")),
        h("dd", {}, [
          h("a", {href: "update", target: "_blank"}, text("update")),
        ]),
      ]), // </dl>

      h("div", {class: "actions"}, [
        h("button", {onclick: ActivatePump, disabled: disableInputs}, text("Pump now!")),
        h("button", {onclick: ResetPumpTime, disabled: disableInputs}, text("Reset pump timer!")),
        h("button", {onclick: RebootServer, disabled: disableInputs}, text("Reboot!")),
      ]),

      ShowGraph(serverstatus),
    ]), // </main>

    activeTab == "prefs" && h('main', {}, [

      h("fieldset", {}, [
        h("legend", {}, text("System settings")),
        h("dl", {}, [
          h("dt", {}, text("Server time")),
          h("dd", {}, [
            h("div", {}, text(serverstatus.serverTime)),
          ]),
          h("dt", {}, []),
          h("dd", {}, [
            h("input", {
              type: "button",
              value: "Update",
              onclick: UpdateServerTime,
            }),
          ]),
        ]), // </dl>
      ]),

      h("fieldset", {}, [
        h("legend", {}, text("Pump settings")),
        h("dl", {}, [
          h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpInterval")}}, text("Pump interval:")),
          h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpInterval")}}, [
            h("input", {
              type: "number",
              value: (editstatus.pumpInterval ?? serverstatus.pumpInterval) / (24 * 3600),
              min: "1",
              max: "99",
              oninput: EditNumber('pumpInterval', 24 * 3600),
            }),
            h("span", {}, text(" days")),
          ]),

          h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpDuration")}}, text("Pump duration:")),
          h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpDuration")}}, [
            h("input", {
              type: "number",
              value: editstatus.pumpDuration ?? serverstatus.pumpDuration,
              min: "100",
              max: "9999",
              oninput: EditNumber('pumpDuration'),
            }),
            h("span", {}, text(" ms")),
          ]),
        ]), // </dl>
      ]),

      h("fieldset", {}, [
        h("legend", {}, text("WiFi settings")),
        h("dl", {}, [
          h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "wifiMode")}}, text("Connection mode:")),
          h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "wifiMode")}}, [
            h("input", {
              type: "radio",
              name: "wifiMode",
              id: "wifiSTA",
              value: "STA",
              checked: (editstatus.wifiMode ?? serverstatus.wifiMode) == "STA" && "checked",
              oninput: EditText('wifiMode'),
            }),
            h("label", {for: "wifiSTA"}, text("Client ")),

            h("span", {class: "spacer"}, []),

            h("input", {
              type: "radio",
              name: "wifiMode",
              id: "wifiAP",
              value: "AP",
              checked: (editstatus.wifiMode ?? serverstatus.wifiMode) == "AP" && "checked",
              oninput: EditText('wifiMode'),
            }),
            h("label", {for: "wifiAP"}, text("Hotspot")),
          ]),

          h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "wifiSsid")}}, text("SSID/name:")),
          h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "wifiSsid")}}, [
            h("input", {
              type: "text",
              value: editstatus.wifiSsid ?? serverstatus.wifiSsid,
              oninput: EditText('wifiSsid'),
            }),
          ]),

          h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "wifiPassword")}}, text("Password:")),
          h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "wifiPassword")}}, [
            h("input", {
              type: "password",
              value: editstatus.wifiPassword ?? "",
              placeholder: "**************",
              oninput: EditText('wifiPassword'),
            }),
          ]),
        ]), // </dl>
      ]),

      h("div", {class: "actions"}, [
        h("button", {onclick: PrefsSave, disabled: disableInputs}, text("Save")),
        h("button", {onclick: PrefsRestore, disabled: disableInputs}, text("Restore")),
      ]),

      ShowGraph(serverstatus),
    ]), // </main>

  ]),

  node: document.getElementById("app"),
})

    </script>
  </body>
</html>
