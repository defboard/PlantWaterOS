<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SensorBoard</title>
    <style>

body {
  display: grid;
  place-items: center;
}

/* javascript handled */

#app {
}

h1 {
  text-align: center;
}

/* navigation */
nav {
  display: flex;
  justify-content: center;
  background-color: #ddd;
}
nav > div {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.3em;
  text-align: center;
  background-color: #bbb;
  cursor: pointer;
}

nav > div.active {
  background-color: #bdb;
}

nav > div:hover {
  background-color: #999;
}

nav > div.active:hover {
  background-color: #9b9;
}

/* main content tab */

main {
}

dl {
  display: grid;
  grid: "name value";
  margin: 0;
}
dl > * {
  padding: 0.5ex 1em;
  margin: 0;
}
dl > *:nth-child(4n+3),
dl > *:nth-child(4n+4) {
  background-color: #eee;
}

dt::after {
  content: " (*)";
  visibility: hidden;
  font-weight: bold;
}
dt.modified::after {
  visibility: visible;
}

/* action buttons */

.actions {
  display: flex;
  justify-content: center;
}
.actions > button {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.1em;
}

    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">

import { h, text, app } from "./hyperapp.js"


// Effects

const fetchJson = (dispatch, [url, action]) => {
  fetch(url)
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const timeout = (dispatch, [delay, action]) => {
  setTimeout(() => dispatch(action), delay);
};


// Events

const DISABLE_TIMEOUT = 750;

const GotServerStatus = (state, serverstatus) => [
  {...state, serverstatus: {...state.serverstatus, ...serverstatus}},
  [timeout, [DISABLE_TIMEOUT, EnableInputs]],
];


// Actions

const EnableInputs = (state) => ({...state, disableInputs: false});
const DisableInputs = (state) => ({...state, disableInputs: true});

const ShowTabStatus = (state) => ({...state, activeTab: "status"});
const ShowTabPrefs = (state) => ({...state, activeTab: "prefs"});

const ActivatePump = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/activate", GotServerStatus]],
]);

const ResetPumpTime = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/reset", GotServerStatus]],
]);

const RebootServer = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/server/reboot", GotServerStatus]],
]);

/* TODO */
const isDefaultValue = (state, key, value) => (state.serverstatus[key] == value);
const hasDefaultValue = (state, key) => (
  state.editstatus[key] == undefined || isDefaultValue(state, key, state.editstatus[key])
);

const PrefsSave = (state) => ({...state});

const PrefsRestore = (state,) => ({...state, editstatus: {}});

const EditNumber = (key) => (state, event) =>  ({
  ...state,
  editstatus: {
    ...state.editstatus,
    [key]: event.target.value,
  },
});


app({
  init: [
    {
      disableInputs: true,
      activeTab: "status",
      serverstatus: {
        serverTime: "",
        bootTime: "",
        localIP: "",
        prevPumpTime: "",
        nextPumpTime: "",
        pumpInterval: "",
        pumpDuration: "",
        numPumpEvents: "",
        sensorValue: "",
        temperature: "",
      },
      editstatus: {}
    },
    [fetchJson, ["api/status", GotServerStatus]],
  ],

  view: ({serverstatus, activeTab, disableInputs, editstatus}) => h("div", {}, [
    h("h1", {}, text("PlantWaterOS")),

    h("nav", {}, [
      h("div", {onclick: ShowTabStatus, class: {active: activeTab == "status"}}, text("Status")),
      h("div", {onclick: ShowTabPrefs, class: {active: activeTab == "prefs"}}, text("Preferences")),
    ]),

    activeTab == "status" && h('main', {}, [
      h("dl", {}, [
        h("dt", {}, text("Server time:")),
        h("dd", {}, text(serverstatus.serverTime)),
        h("dt", {}, text("Server boot time:")),
        h("dd", {}, text(serverstatus.bootTime)),
        h("dt", {}, text("IP:")),
        h("dd", {}, text(serverstatus.localIP)),

        h("dt", {}, text("Last pump time:")),
        h("dd", {}, text(serverstatus.prevPumpTime)),
        h("dt", {}, text("Next pump time:")),
        h("dd", {}, text(serverstatus.nextPumpTime)),

        h("dt", {}, text("Total pump events:")),
        h("dd", {}, text(serverstatus.numPumpEvents)),

        h("dt", {}, text("Soil moisture:")),
        h("dd", {}, text(serverstatus.sensorValue)),
        h("dt", {}, text("Temperature:")),
        h("dd", {}, text(parseFloat(serverstatus.temperature).toFixed(1) + "°C")),

        h("dt", {}, text("System events:")),
        h("dd", {}, [
          h("a", {href: "file/events.log", target: "_blank"}, text("events.log")),
        ]),

        h("dt", {}, text("Logfile:")),
        h("dd", {}, [
          h("a", {href: "file/sensor.log", target: "_blank"}, text("sensor.log")),
        ]),
      ]), // </dl>

      h("div", {class: "actions"}, [
        h("button", {onclick: ActivatePump, disabled: disableInputs}, text("Pump now!")),
        h("button", {onclick: ResetPumpTime, disabled: disableInputs}, text("Reset pump timer!")),
        h("button", {onclick: RebootServer, disabled: disableInputs}, text("Reboot!")),
      ]),
    ]), // </main>

    activeTab == "prefs" && h('main', {}, [
      h("dl", {}, [
        h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpInterval")}}, text("Pump interval:")),
        h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpInterval")}}, [
          h("input", {
            type: "number",
            value: editstatus.pumpInterval ?? serverstatus.pumpInterval,
            min: "1",
            max: "99",
            oninput: EditNumber('pumpInterval'),
          }),
          h("span", {}, text(" days")),
        ]),

        h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpDuration")}}, text("Pump duration:")),
        h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpDuration")}}, [
          h("input", {
            type: "number",
            value: editstatus.pumpDuration ?? serverstatus.pumpDuration,
            min: "100",
            max: "9999",
            oninput: EditNumber('pumpDuration'),
          }),
          h("span", {}, text(" ms")),
        ]),
      ]), // </dl>

      h("div", {class: "actions"}, [
        h("button", {onclick: PrefsSave, disabled: disableInputs}, text("Save")),
        h("button", {onclick: PrefsRestore, disabled: disableInputs}, text("Restore")),
      ]),
    ]), // </main>

  ]),

  node: document.getElementById("app"),
})

    </script>
  </body>
</html>
