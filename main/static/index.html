<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PlantWaterOS</title>
    <style>

body {
  display: grid;
  place-items: center;
}

/* javascript handled */

#app {
}

h1 {
  text-align: center;
}

/* navigation */
nav {
  display: flex;
  justify-content: center;
  background-color: #ddd;
}
nav > div {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.3em;
  text-align: center;
  background-color: #bbb;
  cursor: pointer;
}

nav > div.disabled {
  cursor: not-allowed;
}

nav > div.active {
  background-color: #bdb;
}

nav > div:hover {
  background-color: #999;
}

nav > div.active:hover {
  background-color: #9b9;
}

/* main content tab */

main {
}

fieldset {
  padding: 0px 3px 3px 3px; /* t r b l */
  margin-top: 5px;
  margin-bottom: 10px;
  border: none;
  box-shadow: 0 0 10px #666;
  border-radius: 10px;
}
fieldset > legend {
  transform: translateY(-20%);
  background-color: white;
  font-size: 80%;
  font-weight: bold;
  width: auto;
  margin-left: auto;
  margin-right: auto;
}

dl {
  display: grid;
  grid: "name value";
  grid-template-columns: 1fr 1fr;
  margin: 0;
}
dl > * {
  padding: 0.5ex 1em;
  margin: 0;
}

dl > *:nth-child(4n+1),
dl > *:nth-child(4n+2) {
  background-color: #eee;
}
dl > *:nth-child(4n+3),
dl > *:nth-child(4n+4) {
  background-color: #fff;
}

dd input[type="button"] {
  width: 100%;
}

dd button {
  font-weight: bold;
  margin-left: 0.5em;
  margin-right: 0.5em;
}

dt::after {
  content: " (*)";
  visibility: hidden;
  font-weight: bold;
}
dt.modified::after {
  visibility: visible;
}

dd progress {
  width: 100%;
}

dt.success, dd.success {
  background-color: #8e8;
}

dt.failure, dd.failure {
  background-color: #ee8;
}

dt.error, dd.error {
  background-color: #e88;
}

/* action buttons */

.actions {
  display: flex;
  justify-content: center;
}
.actions > button {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.1em;
}

/* Plot */
.dataPoint {
  stroke: black;
  stroke-width: 0.2;
  fill: #00f;
}

.axis {
  stroke: black;
  stroke-width: 0.3;
}

.xtick, .ytick {
  stroke: black;
  stroke-width: 0.2;
}

.xticklabel {
  font-size: 3px;
  text-anchor: middle;
  dominant-baseline: hanging;
}

.yticklabel {
  font-size: 3px;
  text-anchor: end;
  dominant-baseline: middle;
}

.xgrid, .ygrid {
  stroke: gray;
  stroke-width: 0.1;
}

    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">

import { h, text, app } from "./hyperapp.js"


const updateRecursive = (a, b) => {
  for (const key in b) {
    if (typeof(a[key]) == "object" && !Array.isArray(a[key]) &&
        typeof(b[key]) == "object" && !Array.isArray(b[key]))
    {
      updateRecursive(a[key], b[key]);
    }
    else {
      a[key] = b[key];
    }
  }
  return a;
};


const JSON_safeParse = (text) => {
  try {
    return JSON.parse(text) || {};
  }
  catch (e) {
    return {};
  }
}

// Local storage

const storageKey = 'PlantWaterOS';
const savedState = JSON.parse(localStorage.getItem(storageKey) || "{}");
const initialState = {
  serverstatus: {
    serverTime: "",
    uptime: "",
    prevPumpTime: "",
    nextPumpTime: "",
    pumpInterval: "",
    pumpDuration: "",
    numPumpEvents: "",
    sensorValue: "",
    temperature: "",
    sensorData: [],
    wifiMode: "STA",
    wifiSsid: "PlantWaterNet",
    wifiHostname: "PlantWaterOS",
    wifiPassword: "",
  },
  // client
  activeTab: "status",
  editstatus: {},
  // Will be `undefined` initially, but our code should be able to handle this:
  // serverTime,
  // requestTime,
};
updateRecursive(initialState, savedState);
updateRecursive(initialState, {
  disableInputs: true,
});

const storeLocal = (state) => {
  localStorage.setItem(storageKey, JSON.stringify({
    activeTab: state.activeTab,
    serverstatus: state.serverstatus,
    serverTime: state.serverTime,
    requestTime: state.requestTime,
  }));
  return UpdateUI(state);
};

/*
 * Format local time in ISO 8601 format.
 *
 * Can not use d.getISOString() because it returns the time in UTC.
*/
const _localTime = (d) => {
  const pad = (num, places) => num.toString().padStart(places, '0');
  return {
    yyyy: pad(d.getFullYear(), 4),
    mm: pad(d.getMonth() + 1, 2),
    dd: pad(d.getDate(), 2),
    HH: pad(d.getHours(), 2),
    MM: pad(d.getMinutes(), 2),
    SS: pad(d.getSeconds(), 2),
    fff: pad(d.getMilliseconds(), 3),
  };
};

const formatDateTime_ISO8601 = (d) => {
  const {yyyy, mm, dd, HH, MM, SS, fff} = _localTime(d);
  return `${yyyy}-${mm}-${dd}T${HH}:${MM}:${SS}.${fff}Z`;
};

const formatDateTime_input = (d) => {
  if (d) {
    const {yyyy, mm, dd, HH, MM, SS, fff} = _localTime(d);
    return `${yyyy}-${mm}-${dd}T${HH}:${MM}`;
  }
};

const formatDateTime_simple = (d) => {
  if (!d) {
    return "n/a";
  }
  const {yyyy, mm, dd, HH, MM, SS} = _localTime(d);
  return `${yyyy}-${mm}-${dd} ${HH}:${MM}:${SS}`;
};

const parseDateTime_input = (d) => {
  return formatDateTime_simple(new Date(Date.parse(d)));
};

const DAYS_TO_SECONDS = 24 * 3600;
const SECONDS_TO_MILLIS = 1000;

const formatTimeSpan_simple = (t) => {
  if (!t) {
    return "n/a";
  }
  const days = Math.floor(t / DAYS_TO_SECONDS);
  const hours = Math.floor(t / 3600) % 24;
  const minutes = Math.floor(t / 60) % 60;
  const seconds = Math.floor(t) % 60;
  return `${days}d ${hours}h ${minutes}m ${seconds}s`;
};

// Effects

const fetchJson = (dispatch, [url, action]) => {
  fetch(url)
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const postRequest = (dispatch, [url, data, action]) => {
  fetch(url, {
    method: "POST",
    body: new URLSearchParams(data),
  })
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const uploadFile = (dispatch, [url, file, progressAction, finishAction]) => {
  const request = new XMLHttpRequest();
  request.open("POST", url);
  request.upload.onprogress = (event) => dispatch(progressAction, event);
  request.onreadystatechange = (event) => {
    if (request.readyState == 4) {
      dispatch(finishAction, event);
    }
  };
  const form = new FormData();
  form.append("file", file, file.name),
  request.send(form);
};

const timeout = (dispatch, [delay, action]) => {
  setTimeout(() => dispatch(action), delay);
};

const reloadWindow = (dispatch) => {
  window.location.reload();
};

const every = (dispatch, [delay, action]) => {
  const id = setInterval(() => { dispatch(action); }, delay);
  return () => clearInterval(id);
};

const adjustTime = (time, delta) => {
  if (time === undefined || time === null ||
      !(typeof(delta) == "number") || isNaN(delta))
  {
    return time;
  }
  return new Date(time.valueOf() + delta);
};


// Events

const DISABLE_TIMEOUT = 750;
const RELOAD_TIMEOUT = 10_000;

const GotServerStatus = (state, serverstatus) => {
  // Can be NaN if serverstatus.serverTime is undefined or invalid:
  const serverTime = Date.parse(serverstatus.serverTime);
  const requestTime = new Date().valueOf();
  const newState = isNaN(serverTime) ? state : storeLocal({
      ...state,
      serverTime,
      requestTime,
      serverstatus: {
        ...state.serverstatus,
        ...serverstatus,
      },
  });
  return [
    newState,
    [timeout, [DISABLE_TIMEOUT, EnableInputs]],
  ];
};


// Actions

const UpdateUI = (state) => {
  const clientTime = new Date().valueOf();
  const elapsedTime = clientTime - state.requestTime;
  const adjustedServerTime = adjustTime(state.serverTime, elapsedTime);
  const adjustedUptime = state.serverstatus.uptime + elapsedTime / SECONDS_TO_MILLIS;
  const editstatus = Object.fromEntries(Object.entries(state.editstatus).filter(
    ([key, value]) => (value != state.serverstatus[key]),
  ));
  return {
    ...state,
    editstatus,
    adjustedServerTime,
    adjustedUptime,
  };
}

const EnableInputs = (state) => storeLocal({...state, disableInputs: false});
const DisableInputs = (state) => storeLocal({...state, disableInputs: true});
const ReloadWindow = (state) => [state, reloadWindow];

const ShowTab = (activeTab) => (state) => storeLocal({
  ...state,
  activeTab,
  firmwareImage: undefined,
  uploadProgress: undefined,
  uploadResult: undefined,
});

const ActivatePump = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/activate", GotServerStatus]],
]);

const RebootServer = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/server/reboot", GotServerStatus]],
]);

const UpdateServerTime = (state, event) => {
  const data = {
    serverTime: formatDateTime_ISO8601(new Date()),
  };
  return [
    DisableInputs(state),
    [postRequest, ["api/server/time", data, GotServerStatus]],
  ];
};

const UploadProgress = (state, event) => {
  const uploadProgress = {
    max: event.total,
    value: event.loaded,
  };
  return { ...state, uploadProgress };
};

const UploadFinished = (state, event) => {
  const query = event.target;
  const { status, statusText } = query;
  const response = JSON_safeParse(query.responseText);
  const uploadResult = { status, statusText, ...response };
  const success = uploadResult.status == 200 && uploadResult.code == 0;
  const reloadTime = success ? Date.now() + RELOAD_TIMEOUT : undefined;
  const effect = (
    success
    ? [timeout, [RELOAD_TIMEOUT, ReloadWindow]]
    : [timeout, [DISABLE_TIMEOUT, EnableInputs]]
  );
  return [
    { ...state, uploadResult, reloadTime },
    effect,
  ];
};

// Preferences
const hasDefaultValue = (state, key) => (
  state.editstatus[key] == undefined
);

const SetEditField = (state, key, value) => ({
  ...state,
  editstatus: {
    ...state.editstatus,
    [key]: value,
  },
});

const PrefsSave = (state, event) => ([
  DisableInputs(SetEditField(state, "wifiPassword", undefined)),
  [postRequest, ["prefs", state.editstatus, GotServerStatus]],
]);

const PrefsRestore = (state) => storeLocal({...state, editstatus: {}});

const UploadFirmware = (state) => ([
  DisableInputs(state),
  [uploadFile, ["update", state.firmwareImage, UploadProgress, UploadFinished]],
]);


const EditField = (key, parse) => (state, event) => storeLocal(SetEditField(state, key, parse(event.target.value)));

const EditNumber = (key, multiplier) => EditField(key, (value) => Math.round(value * (multiplier ?? 1)));
const EditText = (key) => EditField(key, (value) => value);
const EditDate = (key) => EditField(key, (value) => parseDateTime_input(value));

const EditFile = (key) => (state, event) => {
  return storeLocal({
    ...state,
    firmwareImage: event.target.files.length == 1 && event.target.files[0],
  });
};


// UI components

const Fieldset = (legend, fields) => (
  h("fieldset", {}, [
    h("legend", {}, text(legend)),
    h("dl", {}, fields.flat(1)),
  ])
);

const Field = (dt, props, dd) => ([
  h("dt", props, text(dt)),
  h("dd", props, dd),
]);

const HyperRef = (href, name) => (
  h("a", {href, target: "_blank"}, text(name))
);

const InputField = (state, key, label, contentFunc) => {
  const default_ = state.serverstatus[key];
  const value = state.editstatus[key] ?? default_;
  const modified = value != default_;
  return Field(label, {class: {modified}}, contentFunc(key, value));
};

const TextInput = (props) => (key, value) => h("input", {
  type: "text",
  value,
  oninput: EditText(key),
  ...props,
});

const NumberInput = (props, multiplier, unitName) => (key, value) => [
  h("input", {
    type: "number",
    value: value / multiplier,
    oninput: EditNumber(key, multiplier),
    ...props,
  }),
  unitName &&
  h("span", {}, text(unitName)),
];

const DateInput = (key, value) => h("input", {
  type: "datetime-local",
  value: formatDateTime_input(new Date(Date.parse(value))),
  min: formatDateTime_input(new Date()),
  oninput: EditDate(key),
});

const RadioList = (name, items) => (key, value) => (
  items.flatMap((item, idx) => [
    h("input", {
      type: "radio",
      name,
      value: item.value,
      id: name + item.value,
      checked: value == item.value,
      oninput: EditText(key),
    }),
    h("label", {for: name + item.value}, text(item.label)),
    (idx == items.length - 1) || h("br", {}, []),
  ])
);

const NavButton = (state, name, label) => {
  const disabled = state.disableInputs;
  const active = state.activeTab == name;
  return h("div", {
    onclick: !disabled && !active && ShowTab(name),
    class: { active, disabled },
  }, text(label));
};


// plotting

const delta = (limits) => limits[1] - limits[0];
const addMargin = (limits, margin) => [limits[0] - margin * delta(limits), limits[1] + margin * delta(limits)];

// Create a transform that maps values within the range [x1, x2] to the range [y1, y2]:
// x → (x - x1) / (x2 - x1) * (y2 - y1) + y1
const AffineTransform = ([x1, x2], [y1, y2]) => {
  const slope = (y2 - y1) / (x2 - x1);
  const offset = y1 - x1 * slope;
  return (x) => offset + slope * x;
};


const makeAxisTicks = ([x1, x2]) => {
  const dx = x2 - x1;
  const tickDeltaInit = Math.pow(10, Math.floor(Math.log10(dx)) - 1);
  const tickDeltaGuess = Array(20).keys().map(i => tickDeltaInit * (i + 1));
  const tickDelta = tickDeltaGuess.find(x => (x * 10 >= dx && x * 4 <= dx));
  let nextTick = Math.ceil(x1 / tickDelta) * tickDelta;
  let tickmarks = [];
  let ticklabels = [];
  while (nextTick < x2) {
    tickmarks.push(nextTick);
    ticklabels.push({loc: nextTick, label: nextTick});
    nextTick += tickDelta;
  }
  return { tickmarks, ticklabels };
};


const makeDateTicks = ([x1, x2]) => {
  const date1 = new Date(x1 * 1000);
  const date2 = new Date(x2 * 1000);

  const SECONDS_PER_DAY = 3600 * 24;

  const day1 = Date.UTC(date1.getFullYear(), date1.getMonth(), date1.getDate());
  const day2 = Date.UTC(date2.getFullYear(), date2.getMonth(), date2.getDate());

  const tickDelta = SECONDS_PER_DAY;
  let nextTick = day1.valueOf() / 1000;
  let lastTick = day2.valueOf() / 1000;
  let tickmarks = [];
  let ticklabels = [];
  while (nextTick <= lastTick) {
    if (nextTick >= x1 && nextTick <= x2) {
      const asDate = new Date(nextTick * 1000);
      tickmarks.push(nextTick);
      ticklabels.push({
        loc: nextTick + SECONDS_PER_DAY/2,
        label: `${asDate.getDate()}.${asDate.getMonth() + 1}.`,
      });
    }
    nextTick += tickDelta;
  }

  return { tickmarks, ticklabels };
};

const drawXAxis = (axisBounds, {tickmarks, ticklabels}, dataToFigure) => {
  const [x1, x2] = axisBounds.x;
  const [y1, y2] = axisBounds.y;
  return [
    h("line", { x1, y1, x2: x2, y2: y1, class: "axis" }, []),

    ...tickmarks.map(loc => {
      const x = dataToFigure(loc);
      return h("line", { x1: x, x2: x, y1: y1 - 1, y2: y1 + 1, class: "xtick" }, []);
    }),
    ...tickmarks.map(loc => {
      const x = dataToFigure(loc);
      return h("line", { x1: x, x2: x, y1, y2, class: "xgrid" }, [])
    }),

    ...ticklabels.map(({loc, label}) => {
      const x = dataToFigure(loc);
      return h("text", { x: x, y: y1 + 2, class: "xticklabel" }, text(label));
    }),
  ];
};

const drawYAxis = (axisBounds, {tickmarks, ticklabels}, dataToFigure) => {
  const [x1, x2] = axisBounds.x;
  const [y1, y2] = axisBounds.y;
  return [
    h("line", {  x1, y1, x2: x1, y2: y2, class: "axis" }, []),

    ...tickmarks.map(loc => {
      const y = dataToFigure(loc);
      return h("line", { y1: y, y2: y, x1: x1 - 1, x2: x1 + 1, class: "ytick" }, []);
    }),
    ...tickmarks.map(loc => {
      const y = dataToFigure(loc);
      return h("line", { y1: y, y2: y, x1, x2, class: "ygrid" }, []);
    }),

    ...ticklabels.map(({loc, label}) => {
      const y = dataToFigure(loc);
      return h("text", { x: x1 - 2, y: y, class: "yticklabel" }, text(label));
    }),
  ];
};


const ShowGraph = ({sensorData}) => {
    const axisBounds = {x: [10, 95], y: [90, 5]};

    const xdata = sensorData.map(elem => elem[0]);
    const ydata = sensorData.map(elem => elem[1]);
    const xdatalim = [Math.min(...xdata), Math.max(...xdata)];
    const ydatalim = [Math.min(...ydata), Math.max(...ydata)];
    const xlim = addMargin(xdatalim, 0.1);
    const ylim = addMargin(ydatalim, 0.1);
    const xticks = makeDateTicks(xlim);
    const yticks = makeAxisTicks(ylim);

    const dataToFigure = {
      x: AffineTransform(xlim, axisBounds.x),
      y: AffineTransform(ylim, axisBounds.y),
    };

    return h("svg", { viewBox: "0 0 100 100" }, [
        ...drawXAxis(axisBounds, xticks, dataToFigure.x),
        ...drawYAxis(axisBounds, yticks, dataToFigure.y),
        ...sensorData.map(([x, y]) => {
          return h("circle", {
            cx: dataToFigure.x(x),
            cy: dataToFigure.y(y),
            r: 0.5,
            class: "dataPoint",
          }, []);
        }),
    ]);
};


app({
  init: [
    UpdateUI(initialState),
    [fetchJson, ["api/status", GotServerStatus]],
  ],

  subscriptions: (state) => [
    [every, [1000, UpdateUI]],
  ],

  view: (state) => {
    const {serverstatus, activeTab, disableInputs, editstatus} = state;
    const isWiFiOff = (editstatus.wifiMode ?? serverstatus.wifiMode) == "OFF";

    return h("div", {}, [
      h("h1", {}, text("PlantWaterOS")),

      h("nav", {}, [
        NavButton(state, "status", "Status"),
        NavButton(state, "prefs", "Preferences"),
        NavButton(state, "update", "Update"),
      ]),

      activeTab == "status" && h('main', {}, [
        Fieldset("Host device", [
          Field("Server time:",        {}, text(formatDateTime_simple(state.adjustedServerTime))),
          Field("Server uptime:",      {}, text(formatTimeSpan_simple(state.adjustedUptime))),
          Field("System events:",      {}, HyperRef("file/events.log", "events.log")),
        ]),

        Fieldset("Pump", [
          Field("Last pump time:",     {}, text(serverstatus.prevPumpTime)),
          Field("Next pump time:",     {}, text(serverstatus.nextPumpTime)),
          Field("Total pump events:",  {}, text(serverstatus.numPumpEvents)),
        ]),

        Fieldset("Sensor", [
          Field("Soil moisture:",      {}, text(serverstatus.sensorValue)),
          Field("Temperature:",        {}, text(parseFloat(serverstatus.temperature).toFixed(1) + "°C")),
          Field("Logfile:",            {}, HyperRef("file/sensor.log", "sensor.log")),
        ]),

        h("div", {class: "actions"}, [
          h("button", {onclick: ActivatePump, disabled: disableInputs}, text("Pump now!")),
          h("button", {onclick: RebootServer, disabled: disableInputs}, text("Reboot!")),
        ]),

        ShowGraph(serverstatus),
      ]), // </main> "status"

      activeTab == "prefs" && h('main', {}, [

        Fieldset("System settings", [
          Field("Server time", {}, [
            h("span", {}, text(formatDateTime_simple(state.adjustedServerTime))),
            h("button", {onclick: UpdateServerTime}, text("🗘")),
          ]),
        ]),

        Fieldset("Pump settings", [
          InputField(state, "nextPumpTime", "Next pump time:", DateInput),
          InputField(state, "pumpInterval", "Pump interval:", NumberInput({min: 0.1, max: 9.9, step: 0.1}, DAYS_TO_SECONDS, " days")),
          InputField(state, "pumpDuration", "Pump duration:", NumberInput({min: 0.1, max: 9.9, step: 0.1}, SECONDS_TO_MILLIS, " s")),
        ]),

        Fieldset("WiFi settings", [
          InputField(state, "wifiMode", "Connection mode:", RadioList("wifiMode", [
            {value: "OFF", label: "Off"},
            {value: "STA", label: "Client"},
            {value: "AP", label: "Hotspot"},
          ])),
          InputField(state, "wifiSsid", "SSID/name:", TextInput({disabled: isWiFiOff})),
          InputField(state, "wifiPassword", "Password:", TextInput({disabled: isWiFiOff, placeholder: "**************"})),
          InputField(state, "wifiHostname", "Device hostname:", TextInput({disabled: isWiFiOff})),
        ]),

        h("div", {class: "actions"}, [
          h("button", {onclick: PrefsSave, disabled: disableInputs}, text("Save")),
          h("button", {onclick: PrefsRestore, disabled: disableInputs}, text("Restore")),
        ]),

        ShowGraph(serverstatus),
      ]), // </main> "prefs"

      activeTab == "update" && h('main', {}, [

        Fieldset("Firmware", [
          Field("Project:",   {}, text(serverstatus.project)),
          Field("Version:",   {}, text(serverstatus.version)),
          Field("Build:",     {}, text(serverstatus.build)),
          Field("ESP-IDF:",   {}, text(serverstatus.idf)),

          InputField(state, "firmwareImage", "Firmware image:", (key, value) => h("input", {
            type: "file",
            accept: ".bin,.bin.gz",
            oninput: EditFile(key),
          })),
        ]),

        (state.uploadProgress || state.uploadResult) &&
        Fieldset("Upload", [
          state.uploadProgress &&
          Field("Progress:", {}, [
            h("progress", state.uploadProgress),
          ]),

          state.uploadResult &&
          Field("Message:", {class: {
            success: state.uploadResult.status == 200 && state.uploadResult.code == 0,
            error: state.uploadResult.status != 200,
            failure: state.uploadResult.code > 0,
          }}, [
            text(state.uploadResult.message ?? state.uploadResult.statusText),
          ]),
        ]),

        h("div", {class: "actions"}, [

          !state.reloadTime &&
          h("button", {
            onclick: UploadFirmware,
            disabled: disableInputs || !state.firmwareImage,
          }, text("Upload firmware")),

          state.reloadTime &&
          h("button", {
            onclick: ReloadWindow,
          }, text(`Reload page (${Math.round((state.reloadTime - Date.now()) / 1000)}s)`)),
        ]),

      ]), // </main>

    ]); // outer div
  },

  node: document.getElementById("app"),
})

    </script>
  </body>
</html>
