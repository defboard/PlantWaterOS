<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SensorBoard</title>
    <style>

body {
  display: grid;
  place-items: center;
}

/* javascript handled */

#app {
}

h1 {
  text-align: center;
}

/* navigation */
nav {
  display: flex;
  justify-content: center;
  background-color: #ddd;
}
nav > div {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.3em;
  text-align: center;
  background-color: #bbb;
  cursor: pointer;
}

nav > div.active {
  background-color: #bdb;
}

nav > div:hover {
  background-color: #999;
}

nav > div.active:hover {
  background-color: #9b9;
}

/* main content tab */

main {
}

dl {
  display: grid;
  grid: "name value";
  margin: 0;
}
dl > * {
  padding: 0.5ex 1em;
  margin: 0;
}
dl > *:nth-child(4n+3),
dl > *:nth-child(4n+4) {
  background-color: #eee;
}

dt::after {
  content: " (*)";
  visibility: hidden;
  font-weight: bold;
}
dt.modified::after {
  visibility: visible;
}

/* action buttons */

.actions {
  display: flex;
  justify-content: center;
}
.actions > button {
  flex-grow: 1;
  flex-basis: 100%;
  margin: 0.5ex 0.1em;
}

/* Plot */
.dataPoint {
  stroke: black;
  stroke-width: 0.2;
  fill: #00f;
}

.axis {
  stroke: black;
  stroke-width: 0.3;
}

.xtick, .ytick {
  stroke: black;
  stroke-width: 0.2;
}

.yticklabel {
  font-size: 3px;
  text-anchor: end;
  dominant-baseline: middle;
}

.xgrid, .ygrid {
  stroke: gray;
  stroke-width: 0.1;
}

    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">

import { h, text, app } from "./hyperapp.js"


// Effects

const fetchJson = (dispatch, [url, action]) => {
  fetch(url)
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const postRequest = (dispatch, [url, data, action]) => {
  fetch(url, {
    method: "POST",
    body: new URLSearchParams(data),
  })
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const timeout = (dispatch, [delay, action]) => {
  setTimeout(() => dispatch(action), delay);
};


// Events

const DISABLE_TIMEOUT = 750;

const GotServerStatus = (state, serverstatus) => [
  {...state, serverstatus: {...state.serverstatus, ...serverstatus}},
  [timeout, [DISABLE_TIMEOUT, EnableInputs]],
];


// Actions

const EnableInputs = (state) => ({...state, disableInputs: false});
const DisableInputs = (state) => ({...state, disableInputs: true});

const ShowTabStatus = (state) => ({...state, activeTab: "status"});
const ShowTabPrefs = (state) => ({...state, activeTab: "prefs"});

const ActivatePump = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/activate", GotServerStatus]],
]);

const ResetPumpTime = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/pump/reset", GotServerStatus]],
]);

const RebootServer = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/server/reboot", GotServerStatus]],
]);

/* TODO */
const isDefaultValue = (state, key, value) => (state.serverstatus[key] == value);
const hasDefaultValue = (state, key) => (
  state.editstatus[key] == undefined || isDefaultValue(state, key, state.editstatus[key])
);

const PrefsSave = (state, event) => ([
  DisableInputs(state),
  [postRequest, ["prefs", state.editstatus, GotServerStatus]],
]);

const PrefsRestore = (state,) => ({...state, editstatus: {}});

const EditNumber = (key, multiplier) => (state, event) =>  ({
  ...state,
  editstatus: {
    ...state.editstatus,
    [key]: event.target.value * (multiplier ?? 1),
  },
});

// plotting

const delta = (limits) => limits[1] - limits[0];
const addMargin = (limits, margin) => [limits[0] - margin * delta(limits), limits[1] + margin * delta(limits)];

class AffineTransform {
  constructor(offset, slope) {
    this.offset = offset;
    this.slope = slope;
  }

  // Create a transform that maps values within the range [x1, x2] to the range [y1, y2]:
  // x → (x - x1) / (x2 - x1) * (y2 - y1) + y1
  static create([x1, x2], [y1, y2]) {
    const slope = (y2 - y1) / (x2 - x1);
    const offset = y1 - x1 * slope;
    return new AffineTransform(offset, slope);
  }

  transform(x) {
    return this.offset + this.slope * x;
  }
};


const makeAxisTicks = ([x1, x2]) => {
  const dx = x2 - x1;
  const tickDeltaInit = Math.pow(10, Math.floor(Math.log10(dx)) - 1);
  const tickDeltaGuess = Array(20).keys().map(i => tickDeltaInit * (i + 1));
  const tickDelta = tickDeltaGuess.find(x => (x * 10 >= dx && x * 4 <= dx));
  let nextTick = Math.ceil(x1 / tickDelta) * tickDelta;
  let ticks = [];
  while (nextTick < x2) {
    ticks.push(nextTick);
    nextTick += tickDelta;
  }
  return ticks;
};

const drawXAxis = (axisBounds, xdataBounds, dataToFigure) => {
  const [x1, x2] = axisBounds.x;
  const [y1, y2] = axisBounds.y;
  const axisTicks = makeAxisTicks(xdataBounds).map(x => dataToFigure.transform(x));
  return [
    h("line", { x1, y1, x2: x2, y2: y1, class: "axis" }, []),
    ...axisTicks.map(x => (
      h("line", { x1: x, x2: x, y1: y1 - 1, y2: y1 + 1, class: "xtick" }, [])
    )),
  ];
};

const drawYAxis = (axisBounds, ydataBounds, dataToFigure) => {
  const [x1, x2] = axisBounds.x;
  const [y1, y2] = axisBounds.y;
  const axisTicks = makeAxisTicks(ydataBounds).map(y => ({
    y: dataToFigure.transform(y),
    label: y,
  }));
  return [
    h("line", {  x1, y1, x2: x1, y2: y2, class: "axis" }, []),
    ...axisTicks.map(({y}) => (
      h("line", { y1: y, y2: y, x1: x1 - 1, x2: x1 + 1, class: "ytick" }, [])
    )),
    ...axisTicks.map(({y}) => (
      h("line", { y1: y, y2: y, x1, x2, class: "ygrid" }, [])
    )),
    ...axisTicks.map(({y, label}) => (
      h("text", { x: x1 - 2, y: y, class: "yticklabel" }, text(label))
    )),
  ];
};


const ShowGraph = ({sensorData}) => {
    const axisBounds = {x: [10, 95], y: [90, 5]};

    const xdata = sensorData.map(elem => elem[0]);
    const ydata = sensorData.map(elem => elem[1]);
    const xlim = addMargin([Math.min(...xdata), Math.max(...xdata)], 0.1);
    const ylim = addMargin([Math.min(...ydata), Math.max(...ydata)], 0.1);
    const dataToFigure = {
      x: AffineTransform.create(xlim, axisBounds.x),
      y: AffineTransform.create(ylim, axisBounds.y),
    };

    return h("svg", { viewBox: "0 0 100 100" }, [
        ...drawXAxis(axisBounds, xlim, dataToFigure.x),
        ...drawYAxis(axisBounds, ylim, dataToFigure.y),
        ...sensorData.map(([x, y]) => {
          return h("circle", {
            cx: dataToFigure.x.transform(x),
            cy: dataToFigure.y.transform(y),
            r: 0.5,
            class: "dataPoint",
          }, []);
        }),
    ]);
};


app({
  init: [
    {
      disableInputs: true,
      activeTab: "status",
      serverstatus: {
        serverTime: "",
        bootTime: "",
        localIP: "",
        prevPumpTime: "",
        nextPumpTime: "",
        pumpInterval: "",
        pumpDuration: "",
        numPumpEvents: "",
        sensorValue: "",
        temperature: "",
        sensorData: [],
      },
      editstatus: {}
    },
    [fetchJson, ["api/status", GotServerStatus]],
  ],

  view: ({serverstatus, activeTab, disableInputs, editstatus}) => h("div", {}, [
    h("h1", {}, text("PlantWaterOS")),

    h("nav", {}, [
      h("div", {onclick: ShowTabStatus, class: {active: activeTab == "status"}}, text("Status")),
      h("div", {onclick: ShowTabPrefs, class: {active: activeTab == "prefs"}}, text("Preferences")),
    ]),

    activeTab == "status" && h('main', {}, [
      h("dl", {}, [
        h("dt", {}, text("Server time:")),
        h("dd", {}, text(serverstatus.serverTime)),
        h("dt", {}, text("Server boot time:")),
        h("dd", {}, text(serverstatus.bootTime)),
        h("dt", {}, text("IP:")),
        h("dd", {}, text(serverstatus.localIP)),

        h("dt", {}, text("Last pump time:")),
        h("dd", {}, text(serverstatus.prevPumpTime)),
        h("dt", {}, text("Next pump time:")),
        h("dd", {}, text(serverstatus.nextPumpTime)),

        h("dt", {}, text("Total pump events:")),
        h("dd", {}, text(serverstatus.numPumpEvents)),

        h("dt", {}, text("Soil moisture:")),
        h("dd", {}, text(serverstatus.sensorValue)),
        h("dt", {}, text("Temperature:")),
        h("dd", {}, text(parseFloat(serverstatus.temperature).toFixed(1) + "°C")),

        h("dt", {}, text("System events:")),
        h("dd", {}, [
          h("a", {href: "file/events.log", target: "_blank"}, text("events.log")),
        ]),

        h("dt", {}, text("Logfile:")),
        h("dd", {}, [
          h("a", {href: "file/sensor.log", target: "_blank"}, text("sensor.log")),
        ]),

        h("dt", {}, text("Update firmware:")),
        h("dd", {}, [
          h("a", {href: "update", target: "_blank"}, text("update")),
        ]),
      ]), // </dl>

      h("div", {class: "actions"}, [
        h("button", {onclick: ActivatePump, disabled: disableInputs}, text("Pump now!")),
        h("button", {onclick: ResetPumpTime, disabled: disableInputs}, text("Reset pump timer!")),
        h("button", {onclick: RebootServer, disabled: disableInputs}, text("Reboot!")),
      ]),

      ShowGraph(serverstatus),
    ]), // </main>

    activeTab == "prefs" && h('main', {}, [
      h("dl", {}, [
        h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpInterval")}}, text("Pump interval:")),
        h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpInterval")}}, [
          h("input", {
            type: "number",
            value: (editstatus.pumpInterval ?? serverstatus.pumpInterval) / (24 * 3600),
            min: "1",
            max: "99",
            oninput: EditNumber('pumpInterval', 24 * 3600),
          }),
          h("span", {}, text(" days")),
        ]),

        h("dt", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpDuration")}}, text("Pump duration:")),
        h("dd", {class: {modified: !hasDefaultValue({serverstatus, editstatus}, "pumpDuration")}}, [
          h("input", {
            type: "number",
            value: editstatus.pumpDuration ?? serverstatus.pumpDuration,
            min: "100",
            max: "9999",
            oninput: EditNumber('pumpDuration'),
          }),
          h("span", {}, text(" ms")),
        ]),
      ]), // </dl>

      h("div", {class: "actions"}, [
        h("button", {onclick: PrefsSave, disabled: disableInputs}, text("Save")),
        h("button", {onclick: PrefsRestore, disabled: disableInputs}, text("Restore")),
      ]),

      ShowGraph(serverstatus),
    ]), // </main>

  ]),

  node: document.getElementById("app"),
})

    </script>
  </body>
</html>
